name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: rake test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          # Dockerfile の ARG RUBY_VERSION と合わせる
          ruby-version: '3.3.0'
          bundler-cache: true

      # 外部APIに接続しないテスト。ここが落ちたら失敗させる。
      - run: bundle exec rake test

  # tcgdex API の仕様変更・障害を検知するための疎通テスト。
  # 外部サービス依存で不安定になりうるため、PR はブロックしない。
  live:
    name: rake test_live (外部API)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.0'
          bundler-cache: true

      - run: bundle exec rake test_live
